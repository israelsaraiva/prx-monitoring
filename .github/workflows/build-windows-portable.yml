name: Build Windows Portable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Pin the Node.js version used for the portable bundle so builds are reproducible.
  # Update this intentionally when upgrading Node.js.
  NODE_PORTABLE_VERSION: '20.19.2'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      archive-name: ${{ steps.version.outputs.ARCHIVE_NAME }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js standalone
        run: pnpm build

      # ── Resolve version ────────────────────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE_NAME=macc-monitoring-v${VERSION}-win" >> "$GITHUB_OUTPUT"

      # ── Download portable Node.js for Windows ─────────────────────────────
      - name: Download Node.js ${{ env.NODE_PORTABLE_VERSION }} portable (Windows x64)
        run: |
          NODE_ZIP="node-v${{ env.NODE_PORTABLE_VERSION }}-win-x64.zip"
          curl -fsSL "https://nodejs.org/dist/v${{ env.NODE_PORTABLE_VERSION }}/${NODE_ZIP}" -o node-win.zip
          unzip -q node-win.zip
          mkdir -p dist-node
          cp "node-v${{ env.NODE_PORTABLE_VERSION }}-win-x64/node.exe" dist-node/node.exe

      # ── Assemble portable package ──────────────────────────────────────────
      - name: Assemble package
        run: |
          ARCHIVE_NAME="${{ steps.version.outputs.ARCHIVE_NAME }}"
          mkdir -p "${ARCHIVE_NAME}/node"
          mkdir -p "${ARCHIVE_NAME}/app/.next"

          # Node.js runtime
          cp dist-node/node.exe "${ARCHIVE_NAME}/node/node.exe"

          # Next.js standalone output (.next/standalone already contains node_modules)
          cp -r .next/standalone/. "${ARCHIVE_NAME}/app/"

          # Static assets must be placed alongside the standalone server
          cp -r .next/static "${ARCHIVE_NAME}/app/.next/static"

          # Public folder (optional — guard in case it is empty or absent)
          if [ -d public ] && [ "$(ls -A public)" ]; then
            cp -r public "${ARCHIVE_NAME}/app/public"
          fi

          # Launcher scripts
          cp start.bat "${ARCHIVE_NAME}/start.bat"
          cp stop.bat  "${ARCHIVE_NAME}/stop.bat"

      # ── Zip the package ────────────────────────────────────────────────────
      - name: Create zip archive
        run: |
          ARCHIVE_NAME="${{ steps.version.outputs.ARCHIVE_NAME }}"
          zip -r "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}/"
          echo "Archive size: $(du -sh ${ARCHIVE_NAME}.zip | cut -f1)"

      # ── Upload as workflow artifact (always) ──────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.ARCHIVE_NAME }}
          path: ${{ steps.version.outputs.ARCHIVE_NAME }}.zip
          retention-days: 30

      # ── Publish as GitHub Release (only on version tags) ──────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.ARCHIVE_NAME }}.zip
          generate_release_notes: true
          name: v${{ steps.version.outputs.VERSION }}

  # ── Windows smoke test ─────────────────────────────────────────────────────
  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.archive-name }}
          path: test-dist

      - name: Extract archive
        run: Expand-Archive -Path "test-dist\*.zip" -DestinationPath test-dist\extracted
        shell: pwsh

      - name: Start server and verify it responds
        shell: pwsh
        run: |
          $dir = Get-ChildItem test-dist\extracted | Select-Object -First 1
          $node = Join-Path $dir.FullName "node\node.exe"
          $server = Join-Path $dir.FullName "app\server.js"
          $env:PORT = "3099"
          $env:HOSTNAME = "127.0.0.1"
          $proc = Start-Process -FilePath $node -ArgumentList $server -PassThru -NoNewWindow

          # Wait for the server to become ready (up to 30 s)
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:3099" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
          }

          # Always stop the server
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

          if (-not $ready) {
            Write-Error "Server did not respond on port 3099 within 30 seconds."
            exit 1
          }
          Write-Host "Smoke test passed — server responded with HTTP 200."
